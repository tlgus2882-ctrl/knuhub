name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime

      - name: Generated DB types are up to date
        run: |
          npm run db:types
          git diff --exit-code -- src/lib/supabase/database.types.ts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:db
